<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verifikasi Filling</title>
  <meta name="description" content="Aplikasi verifikasi kelengkapan dokumen transaksi keuangan dengan integrasi Google Sheets dan Google Drive.">
  <meta property="og:title" content="Verifikasi Filling">
  <meta property="og:description" content="Aplikasi verifikasi kelengkapan dokumen transaksi keuangan dengan integrasi Google Sheets dan Google Drive.">
  <meta property="og:type" content="website">
  <style>
    :root{--navy:#0f172a;--blue:#2563eb;--bg:#f8fafc;--line:#e2e8f0;--text:#162033;--muted:#64748b;--green:#15803d;--amber:#b45309;--red:#b91c1c}
    *{box-sizing:border-box}
    html,body{width:100%;max-width:100vw;overflow-x:hidden}
    body{margin:0;background:var(--bg);color:var(--text);font:13px Arial,sans-serif}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;display:flex;width:100%}
    .sidebar{position:fixed;inset:0 auto 0 0;width:244px;padding:24px 16px;background:var(--navy);color:#cbd5e1;display:flex;flex-direction:column;z-index:40;transition:transform .25s ease-in-out}
    .sidebar-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:35;display:none}
    .sidebar-overlay.open{display:block}
    .brand{display:flex;align-items:center;gap:11px;padding:0 10px 32px}
    .brand-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#2563eb;color:#fff;font-size:20px}
    .brand strong{display:block;color:#fff;letter-spacing:2px;font-size:14px}
    .brand small{color:#38bdf8;letter-spacing:3px}
    .side-label{padding:0 11px 10px;color:#64748b;font-size:10px;letter-spacing:2px}
    .nav{display:grid;gap:6px}
    .nav button{border:0;border-radius:9px;padding:12px;color:#94a3b8;background:transparent;text-align:left;display:flex;align-items:center;gap:8px}
    .nav button.active,.nav button:hover{color:#fff;background:#1e293b;box-shadow:inset 3px 0 #38bdf8}
    .side-bottom{margin-top:auto;display:grid;gap:10px}
    .user{border-top:1px solid #1e293b;padding:14px 8px 4px;color:#94a3b8;font-size:11px;display:flex;align-items:center;gap:10px}
    .user b{color:#cbd5e1}
    .btn-api-cfg{border:1px solid #334155;border-radius:8px;background:#1e293b;color:#94a3b8;padding:8px 10px;font-size:11px;text-align:left;display:flex;align-items:center;gap:6px;cursor:pointer}
    .btn-api-cfg:hover{color:#fff;background:#334155}
    .main{margin-left:244px;min-height:100vh;flex:1;width:calc(100% - 244px);display:flex;flex-direction:column}
    .topbar{height:76px;padding:0 36px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
    .topbar-left{display:flex;align-items:center;gap:14px}
    .menu-toggle{display:none;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font-size:20px;padding:0}
    .eyebrow,.kicker{font-size:10px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:#94a3b8}
    .topbar h1{margin:4px 0 0;font-size:22px}
    .today{color:var(--muted);font-size:11px}
    .content{padding:28px 36px;flex:1}
    .intro{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px}
    .intro h2{margin:6px 0 4px;font-size:22px}
    .intro p{margin:0;color:var(--muted);font-size:12px}
    .primary{border:0;border-radius:8px;padding:11px 18px;min-height:42px;background:var(--blue);color:white;font-weight:bold;display:inline-flex;align-items:center;justify-content:center;gap:6px}
    .primary:disabled{opacity:0.65;cursor:not-allowed}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:19px}
    .stat,.panel,.table-wrap{border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:0 3px 12px #0f172a08}
    .stat{padding:16px;min-height:103px}
    .stat small,.stat span{display:block;color:var(--muted);font-size:10px}
    .stat strong{display:block;margin:8px 0;font-size:20px}
    .filters{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 16px;margin-bottom:18px;flex-wrap:wrap}
    .search{flex:1;min-width:240px;max-width:360px}
    .search input,.filters select,.form input,.form select{border:1px solid var(--line);border-radius:7px;background:#f8fafc;padding:9px 11px;outline:0;min-height:38px}
    .search input{width:100%}
    .filter-list{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .filter-list label{display:grid;gap:4px;color:#94a3b8;font-size:9px;font-weight:bold}
    .table-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #eef2f7}
    .table-head h3{margin:4px 0 0;font-size:16px}
    .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%}
    table{width:100%;min-width:980px;border-collapse:collapse}
    th,td{padding:12px 10px;border-bottom:1px solid #f1f5f9;text-align:left;white-space:nowrap}
    th{color:#94a3b8;background:#fbfdff;font-size:9px;text-transform:uppercase;letter-spacing:.5px}
    td{font-size:11px;color:#475569}
    .amount{text-align:right}
    .badge{border-radius:999px;padding:5px 9px;font-size:9px;font-weight:bold;display:inline-block}
    .complete{color:var(--green);background:#dcfce7}
    .partial{color:var(--amber);background:#fef3c7}
    .empty{color:var(--red);background:#fee2e2}
    .doc{color:var(--blue);text-decoration:none;font-size:10px;font-weight:bold}
    .doc:hover{text-decoration:underline}
    .missing{color:#94a3b8;font-size:10px}
    .actions{display:flex;gap:6px}
    .actions button{border:0;border-radius:6px;padding:7px 9px;min-height:32px;display:inline-flex;align-items:center;justify-content:center}
    .edit{color:var(--blue);background:#eff6ff}
    .edit:hover{background:#dbeafe}
    .delete{color:var(--red);background:#fef2f2}
    .delete:hover{background:#fee2e2}
    .footer{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;color:#94a3b8;font-size:10px}
    .empty-state{text-align:center;padding:48px 20px;color:var(--muted);font-size:12px;line-height:1.6}
    .modal-bg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:#0f172a88;overflow-y:auto}
    .modal{width:min(680px,96vw);max-height:calc(100vh - 32px);overflow-y:auto;border-radius:14px;background:white;box-shadow:0 20px 40px rgba(15,23,42,.2)}
    .modal header{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--line)}
    .modal header h2{margin:4px 0 0;font-size:20px}
    .close{border:0;background:transparent;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:4px}
    .form{padding:20px 24px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form label{display:grid;gap:6px;color:#475569;font-size:11px;font-weight:bold}
    .form label em{color:red}
    .docs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
    .doc-box{padding:12px;border:1px solid var(--line);border-radius:8px;background:#fbfdff}
    .doc-box h4{margin:0 0 8px;font-size:11px;color:#1e293b}
    .doc-box input[type=file]{width:100%;font-size:10px}
    .doc-box input[type=text]{width:100%;margin-top:4px}
    .doc-sep{text-align:center;font-size:10px;color:#94a3b8;margin:6px 0}
    .doc-label{font-size:10px;color:#64748b;margin-bottom:3px;font-weight:bold}
    .doc-status{font-size:10px;margin-top:5px;min-height:14px}
    .doc-current{margin-bottom:8px;padding:6px 8px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;font-size:10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
    .modal-foot{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid var(--line);gap:12px}
    .secondary{border:1px solid var(--line);border-radius:7px;padding:10px 16px;min-height:42px;background:#fff;color:var(--text);font-weight:bold}
    .toast{position:fixed;right:20px;top:20px;z-index:60;padding:13px 18px;border-radius:8px;color:#fff;background:#0f172a;box-shadow:0 10px 25px #0f172a30;max-width:min(400px,90vw);font-size:12px;line-height:1.4}
    .hidden{display:none}
    @media(max-width:1100px){
      .stats{grid-template-columns:repeat(3,1fr)}
      .stat:last-child{grid-column:span 2}
    }
    @media(max-width:768px){
      .sidebar{transform:translateX(-100%)}
      .sidebar.open{transform:translateX(0);box-shadow:4px 0 25px rgba(0,0,0,0.3)}
      .main{margin-left:0;width:100%}
      .topbar{padding:0 16px}
      .menu-toggle{display:inline-flex}
      .content{padding:20px 16px}
      .stats{grid-template-columns:1fr 1fr;gap:10px}
      .stat:last-child{grid-column:span 2}
      .intro{flex-direction:column;align-items:stretch}
      .intro .primary{width:100%;margin-top:10px}
      .filters{padding:12px;flex-direction:column;align-items:stretch}
      .search{max-width:none;width:100%;min-width:0}
      .filter-list{display:grid;grid-template-columns:1fr 1fr;width:100%}
      .grid{grid-template-columns:1fr}
      .docs{grid-template-columns:1fr}
      .modal-foot{flex-direction:column-reverse;align-items:stretch}
      .modal-foot > div{display:flex;flex-direction:column-reverse;gap:8px;width:100%}
      .modal-foot button{width:100%}
      .modal header{padding:16px}
      .form{padding:16px}
    }
    @media(max-width:440px){
      .filter-list{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script>
// ==========================================================================
// KONFIGURASI API BACKEND GOOGLE APPS SCRIPT (UNTUK GITHUB PAGES)
// ==========================================================================
// Jika aplikasi di-host di GitHub Pages, masukkan URL Web App Google Apps Script Anda di sini.
// Contoh: const API_URL = 'https://script.google.com/macros/s/AKfycbx.../exec';
// Jika aplikasi dijalankan langsung di dalam Google Apps Script, biarkan kosong.
const API_URL = '';

const isAppsScript = typeof google !== 'undefined' && Boolean(google.script) && Boolean(google.script.run);
let data = [], banks = [], filter = { q: '', month: '0', year: 'all', bank: 'all', status: 'all' }, editing = null;
let pendingFiles = {}, removedDocs = {};
let isSidebarOpen = false;

const $ = id => document.getElementById(id);
const rupiah = value => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(Number(value) || 0);
const toast = message => {
  const el = $('toast');
  if (!el) return;
  el.textContent = message;
  el.classList.remove('hidden');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.add('hidden'), 3500);
};

function getActiveApiUrl() {
  return API_URL || (typeof localStorage !== 'undefined' ? localStorage.getItem('VERIFIKASI_API_URL') : '') || '';
}

function call(name, args = []) {
  if (isAppsScript) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(error))[name](...args);
    });
  }
  const url = getActiveApiUrl();
  if (!url) {
    return Promise.reject(new Error('URL Backend API belum dikonfigurasi. Silakan tentukan URL Web App pada menu Konfigurasi API.'));
  }
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: name, args: args })
  })
    .then(res => {
      if (!res.ok) throw new Error('HTTP Error: ' + res.status);
      return res.json();
    })
    .then(res => {
      if (!res.success) throw new Error(res.error || 'Terjadi kesalahan pada backend.');
      return res.data;
    });
}

function toggleSidebar(forcedState) {
  isSidebarOpen = forcedState !== undefined ? forcedState : !isSidebarOpen;
  const sb = $('sidebar');
  const ov = $('sidebar-overlay');
  if (sb) sb.classList.toggle('open', isSidebarOpen);
  if (ov) ov.classList.toggle('open', isSidebarOpen);
}

function render() {
  const filtered = data.filter(t => {
    const d = new Date(t.tanggalTransaksi);
    return (!filter.q || t.noTransaksi.toLowerCase().includes(filter.q) || t.namaBank.toLowerCase().includes(filter.q))
      && (filter.month === '0' || String(d.getMonth() + 1) === filter.month)
      && (filter.year === 'all' || t.tanggalTransaksi.startsWith(filter.year))
      && (filter.bank === 'all' || t.namaBank === filter.bank)
      && (filter.status === 'all' || t.statusBukti === filter.status);
  }).sort((a, b) => b.tanggalTransaksi.localeCompare(a.tanggalTransaksi));

  const total = filtered.reduce((s, t) => s + Number(t.jumlahTransaksi), 0);

  $('app').innerHTML = `
    <div id="sidebar-overlay" class="sidebar-overlay ${isSidebarOpen ? 'open' : ''}" onclick="toggleSidebar(false)"></div>
    <aside id="sidebar" class="sidebar ${isSidebarOpen ? 'open' : ''}">
      <div class="brand">
        <div class="brand-icon">✓</div>
        <div><strong>VERIFIKASI</strong><small>FILLING</small></div>
      </div>
      <div class="side-label">WORKSPACE</div>
      <div class="nav">
        <button class="active" onclick="toggleSidebar(false)">▦ &nbsp; Dashboard</button>
      </div>
      <div class="side-bottom">
        ${!isAppsScript ? `
          <button type="button" class="btn-api-cfg" onclick="showApiConfigModal()">
            ⚙ <span>Pengaturan API</span>
          </button>
        ` : ''}
        <div class="user">◉ <span><b>Finance & Accounting</b><br>Workspace aktif</span></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Buka Menu">☰</button>
          <div><div class="eyebrow">FINANCE CONTROL DESK</div><h1>Dashboard</h1></div>
        </div>
        <div class="today">▣ &nbsp; ${new Intl.DateTimeFormat('id-ID', { dateStyle: 'full' }).format(new Date())}</div>
      </header>
      <div class="content">
        <div class="intro">
          <div>
            <div class="eyebrow">RINGKASAN VERIFIKASI</div>
            <h2>Kontrol kelengkapan dokumen</h2>
            <p>Pantau bukti transaksi dan tindak lanjuti dokumen yang belum lengkap.</p>
          </div>
          <button class="primary" onclick="openForm()">＋ Tambah Transaksi</button>
        </div>
        <section class="stats">
          ${stat('Total Transaksi', filtered.length, 'Semua transaksi')}
          ${stat('Bukti Lengkap', filtered.filter(t => t.statusBukti === 'BUKTI LENGKAP').length, 'sudah terverifikasi')}
          ${stat('Sebagian Lengkap', filtered.filter(t => t.statusBukti === 'SEBAGIAN LENGKAP').length, 'perlu tindak lanjut')}
          ${stat('Tidak Ada Bukti', filtered.filter(t => t.statusBukti === 'TIDAK ADA BUKTI').length, 'segera lengkapi')}
          ${stat('Total Nilai Transaksi', rupiah(total), 'mengikuti filter aktif')}
        </section>
        <section class="panel filters">
          <div class="search">⌕ <input placeholder="Cari No Transaksi atau Nama Bank..." value="${filter.q}" oninput="filter.q=this.value.toLowerCase();render()"></div>
          <div class="filter-list">
            ${select('month', 'Bulan', ['Semua Bulan', 'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'])}
            ${select('year', 'Tahun', ['Semua Tahun', ...years(data)])}
            ${select('bank', 'Bank', ['Semua Bank', ...banks])}
            ${select('status', 'Status', ['Semua Status', 'Bukti Lengkap', 'Sebagian Lengkap', 'Tidak Ada Bukti'])}
          </div>
        </section>
        <section class="table-wrap">
          <div class="table-head">
            <div><div class="kicker">DATA TRANSAKSI</div><h3>Daftar transaksi</h3></div>
            <span>${filtered.length} transaksi ditemukan</span>
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>No</th>
                  <th>Transaksi</th>
                  <th>Bank</th>
                  <th>Tanggal</th>
                  <th>Jumlah</th>
                  <th>Pengajuan</th>
                  <th>Bayar</th>
                  <th>Invoice</th>
                  <th>Status</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody>
                ${filtered.map((t, i) => row(t, i + 1)).join('')}
              </tbody>
            </table>
          </div>
          ${filtered.length ? '' : '<div class="empty-state">Belum ada transaksi yang cocok.<br>Ubah filter atau tambahkan transaksi baru.</div>'}
          <div class="footer">
            <span>Menampilkan data terfilter</span>
            <span>Sistem Verifikasi Dokumen</span>
          </div>
        </section>
      </div>
    </main>
  `;
}

function stat(label, value, note) {
  return `<article class="stat"><span>${label}</span><strong>${value}</strong><small>${note}</small></article>`;
}

function years(rows) {
  return [...new Set(rows.map(t => (t.tanggalTransaksi || '').slice(0, 4)).filter(Boolean))];
}

function select(key, label, items) {
  const statusMap = {
    'Semua Status': 'all',
    'Bukti Lengkap': 'BUKTI LENGKAP',
    'Sebagian Lengkap': 'SEBAGIAN LENGKAP',
    'Tidak Ada Bukti': 'TIDAK ADA BUKTI'
  };
  return `<label>${label}<select onchange="filter.${key}=this.value;render()">${items.map((x, i) => {
    let value = 'all';
    if (key === 'month') {
      value = String(i);
    } else if (key === 'status') {
      value = statusMap[x] || 'all';
    } else if (key === 'year' || key === 'bank') {
      value = i === 0 ? 'all' : x;
    }
    return `<option value="${value}" ${filter[key] === value ? 'selected' : ''}>${x}</option>`;
  }).join('')}</select></label>`;
}

function row(t, i) {
  const dateStr = t.tanggalTransaksi ? new Date(t.tanggalTransaksi).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';
  return `<tr>
    <td>${String(i).padStart(2, '0')}</td>
    <td><b>${t.noTransaksi}</b><br><small>Transaksi keuangan</small></td>
    <td>${t.namaBank}</td>
    <td>${dateStr}</td>
    <td class="amount">${rupiah(t.jumlahTransaksi)}</td>
    ${docCell(t.buktiPengajuan)}
    ${docCell(t.buktiBayar)}
    ${docCell(t.invoice)}
    <td><span class="badge ${t.statusBukti === 'BUKTI LENGKAP' ? 'complete' : t.statusBukti === 'SEBAGIAN LENGKAP' ? 'partial' : 'empty'}">${t.statusBukti}</span></td>
    <td>
      <div class="actions">
        <button class="edit" onclick="openForm('${t.id}')" title="Edit transaksi">✎</button>
        <button class="delete" onclick="confirmDelete('${t.id}')" title="Hapus transaksi">⌫</button>
      </div>
    </td>
  </tr>`;
}

function docCell(doc) {
  const url = doc && (doc.fileUrl || doc.url);
  const name = doc && (doc.fileName || doc.name || 'Lihat');
  return `<td>${url ? `<a class="doc" href="${url}" target="_blank" title="${name}">↗ Lihat</a>` : '<span class="missing">Belum ada</span>'}</td>`;
}

function openForm(id) {
  editing = data.find(t => t.id === id) || null;
  pendingFiles = {};
  removedDocs = {};
  const t = editing || { noTransaksi: '', namaBank: '', tanggalTransaksi: '', jumlahTransaksi: '', buktiPengajuan: null, buktiBayar: null, invoice: null };

  const prevModal = $('modal');
  if (prevModal) prevModal.remove();

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <header>
          <div>
            <div class="eyebrow">${editing ? 'PERBARUI DATA' : 'DATA TRANSAKSI BARU'}</div>
            <h2>${editing ? 'Edit transaksi' : 'Tambah transaksi'}</h2>
          </div>
          <button class="close" type="button" onclick="closeModal()">×</button>
        </header>
        <form class="form" onsubmit="save(event)">
          <div class="grid">
            <label>No Transaksi <em>*</em><input id="f-no" required value="${t.noTransaksi}"></label>
            <label>Nama Bank <em>*</em><select id="f-bank" required><option value="">Pilih bank</option>${banks.map(b => `<option ${b === t.namaBank ? 'selected' : ''}>${b}</option>`).join('')}</select></label>
            <label>Tanggal Transaksi <em>*</em><input id="f-date" type="date" required value="${t.tanggalTransaksi}"></label>
            <label>Jumlah Transaksi <em>*</em><input id="f-amount" type="number" min="1" required value="${t.jumlahTransaksi}"></label>
          </div>
          <div class="docs">
            ${docForm('buktiPengajuan', 'Bukti Pengajuan', t.buktiPengajuan)}
            ${docForm('buktiBayar', 'Bukti Bayar', t.buktiBayar)}
            ${docForm('invoice', 'Invoice', t.invoice)}
          </div>
          <div class="modal-foot">
            <span style="font-size:11px;color:var(--muted)">Status dihitung otomatis</span>
            <div style="display:flex;gap:8px;">
              <button type="button" class="secondary" onclick="closeModal()">Batal</button>
              <button type="submit" class="primary" id="btn-save">Simpan</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  `);
}

function docForm(key, label, doc) {
  const hasDoc = Boolean(doc && (doc.fileUrl || doc.url || doc.fileName));
  const docUrl = doc ? (doc.fileUrl || doc.url || '#') : '#';
  const docName = doc ? (doc.fileName || doc.name || 'Lihat Dokumen') : 'Lihat Dokumen';

  return `
    <div class="doc-box" id="box-${key}">
      <h4>${label}</h4>
      ${hasDoc ? `
        <div class="doc-current" id="${key}-current">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;" title="${docName}">
            📄 <a class="doc" href="${docUrl}" target="_blank">${docName}</a>
          </span>
          <button type="button" onclick="removeDoc('${key}')" style="border:0;background:transparent;color:var(--red);font-size:12px;padding:0 4px;font-weight:bold;cursor:pointer;" title="Hapus dokumen">✕</button>
        </div>
      ` : ''}
      <div class="doc-label">Upload Dokumen</div>
      <input id="${key}-file" type="file" accept=".jpg,.jpeg,.png,.pdf" onchange="handleFileSelect('${key}', this)">
      <div id="${key}-file-info" class="doc-status"></div>
      <div class="doc-sep">atau</div>
      <div class="doc-label">Link Google Drive</div>
      <input id="${key}-link" type="text" placeholder="Tempel link Google Drive" value="${hasDoc && (!doc.fileId || !doc.fileName) ? docUrl : ''}" oninput="handleLinkInput('${key}')">
    </div>
  `;
}

function handleLinkInput(key) {
  delete removedDocs[key];
}

function removeDoc(key) {
  removedDocs[key] = true;
  delete pendingFiles[key];
  const currentEl = $(key + '-current');
  if (currentEl) currentEl.style.display = 'none';
  const fileInput = $(key + '-file');
  if (fileInput) fileInput.value = '';
  const infoEl = $(key + '-file-info');
  if (infoEl) infoEl.innerHTML = '<span style="color:var(--muted)">Dokumen ditandai untuk dihapus</span>';
  const linkInput = $(key + '-link');
  if (linkInput) linkInput.value = '';
}

function handleFileSelect(key, input) {
  const file = input.files && input.files[0];
  const infoEl = $(key + '-file-info');
  if (!file) {
    delete pendingFiles[key];
    if (infoEl) infoEl.textContent = '';
    return;
  }
  const ext = file.name.slice(file.name.lastIndexOf('.')).toLowerCase();
  const allowedExts = ['.jpg', '.jpeg', '.png', '.pdf'];
  if (!allowedExts.includes(ext)) {
    input.value = '';
    delete pendingFiles[key];
    if (infoEl) infoEl.textContent = '';
    toast('Format file tidak didukung. Gunakan JPG, JPEG, PNG, atau PDF.');
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    input.value = '';
    delete pendingFiles[key];
    if (infoEl) infoEl.textContent = '';
    toast('Ukuran file terlalu besar. Maksimal 10 MB.');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    pendingFiles[key] = {
      fileName: file.name,
      mimeType: file.type || (ext === '.pdf' ? 'application/pdf' : ext === '.png' ? 'image/png' : 'image/jpeg'),
      base64: e.target.result
    };
    delete removedDocs[key];
    if (infoEl) {
      infoEl.innerHTML = `<span style="color:var(--green)">✓ ${file.name}</span>`;
    }
  };
  reader.onerror = function() {
    input.value = '';
    delete pendingFiles[key];
    if (infoEl) infoEl.textContent = '';
    toast('Gagal membaca file dari device.');
  };
  reader.readAsDataURL(file);
}

function closeModal() {
  const m = $('modal');
  if (m) m.remove();
  editing = null;
  pendingFiles = {};
  removedDocs = {};
}

function save(event) {
  event.preventDefault();
  const noTransaksi = $('f-no').value.trim();
  const namaBank = $('f-bank').value.trim();
  const tanggalTransaksi = $('f-date').value.trim();
  const jumlahTransaksi = Number($('f-amount').value);

  if (!noTransaksi || !namaBank || !tanggalTransaksi || !jumlahTransaksi) {
    toast('Mohon lengkapi semua field yang wajib diisi.');
    return;
  }

  const payload = {
    noTransaksi: noTransaksi,
    namaBank: namaBank,
    tanggalTransaksi: tanggalTransaksi,
    jumlahTransaksi: jumlahTransaksi
  };

  ['buktiPengajuan', 'buktiBayar', 'invoice'].forEach(key => {
    const fileData = pendingFiles[key];
    const linkVal = $(key + '-link') ? $(key + '-link').value.trim() : '';

    if (fileData && fileData.base64) {
      payload[key] = {
        fileName: fileData.fileName,
        mimeType: fileData.mimeType,
        base64: fileData.base64
      };
    } else if (linkVal) {
      payload[key] = {
        url: linkVal,
        name: 'Link Google Drive'
      };
    } else if (removedDocs[key]) {
      payload[key] = null;
    } else if (editing && editing[key]) {
      payload[key] = editing[key];
    } else {
      payload[key] = null;
    }
  });

  const saveBtn = $('btn-save');
  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.textContent = 'Menyimpan...';
  }

  const fn = editing ? 'updateTransaction' : 'addTransaction';
  const args = editing ? [editing.id, payload] : [payload];

  call(fn, args).then(result => {
    if (editing) {
      data = data.map(t => t.id === result.id ? result : t);
    } else {
      data.unshift(result);
    }
    closeModal();
    render();
    toast('Data berhasil disimpan.');
  }).catch(error => {
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Simpan';
    }
    console.error('Error saat menyimpan transaksi:', error);
    toast(error.message || 'Gagal menyimpan data. Silakan coba lagi.');
  });
}

function confirmDelete(id) {
  if (!confirm('Apakah Anda yakin ingin menghapus transaksi ini? File Google Drive tidak akan dihapus.')) return;
  call('deleteTransaction', [id]).then(() => {
    data = data.filter(x => x.id !== id);
    render();
    toast('Transaksi berhasil dihapus.');
  }).catch(error => {
    console.error('Error saat menghapus transaksi:', error);
    toast('Gagal menghapus data. Silakan coba lagi.');
  });
}

function showApiConfigModal() {
  const currentUrl = getActiveApiUrl();
  const prevModal = $('api-modal');
  if (prevModal) prevModal.remove();

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-bg" id="api-modal" onclick="if(event.target===this)closeApiModal()">
      <div class="modal" style="max-width:520px;">
        <header>
          <div>
            <div class="eyebrow">PENGATURAN API</div>
            <h2>Konfigurasi Backend API</h2>
          </div>
          <button class="close" type="button" onclick="closeApiModal()">×</button>
        </header>
        <div class="form">
          <p style="margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.5">
            Masukkan URL Web App Google Apps Script backend Anda (hasil Deploy as Web App dengan akses Anyone):
          </p>
          <label style="margin-bottom:14px;">
            URL Web App Google Apps Script (/exec) <em>*</em>
            <input id="cfg-api-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${currentUrl}" style="width:100%;">
          </label>
          <div class="modal-foot" style="padding:14px 0 0;margin-top:16px;">
            <span></span>
            <div style="display:flex;gap:8px;">
              <button type="button" class="secondary" onclick="closeApiModal()">Tutup</button>
              <button type="button" class="primary" onclick="saveApiUrl()">Simpan & Hubungkan</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  `);
}

function closeApiModal() {
  const m = $('api-modal');
  if (m) m.remove();
}

function saveApiUrl() {
  const input = $('cfg-api-url');
  if (!input) return;
  const val = input.value.trim();
  if (!val) {
    toast('URL API tidak boleh kosong.');
    return;
  }
  localStorage.setItem('VERIFIKASI_API_URL', val);
  closeApiModal();
  toast('URL API disimpan. Memuat data...');
  load();
}

function load() {
  Promise.all([call('getData'), call('getBanks')]).then(values => {
    data = values[0] || [];
    banks = values[1] || [];
    render();
  }).catch(error => {
    render();
    console.error('Error memuat data:', error);
    toast('Gagal terhubung ke server.');
    if (!isAppsScript && !getActiveApiUrl()) {
      showApiConfigModal();
    }
  });
}

load();
</script>
</body>
</html>
