  <style>

    .side-bottom{margin-top:auto;padding-top:20px;display:grid;gap:10px}

    .toast{position:fixed;right:20px;top:20px;z-index:60;padding:13px 18px;border-radius:8px;color:#fff;background:#0f172a;box-shadow:0 10px 25px #0f172a30;max-width:min(420px,90vw);font-size:12px;line-height:1.4}

    /* TAMPILAN DASHBOARD DIAGRAM */

    .dash-card-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #f1f5f9;padding-bottom:14px;margin-bottom:16px}
    .dash-card-head h3{margin:2px 0 0;font-size:16px;color:var(--navy)}
    .dash-body{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
    .donut-wrap{position:relative;width:120px;height:120px;min-width:120px;display:grid;place-items:center}
    .donut-center{position:absolute;text-align:center}
    .donut-center strong{display:block;font-size:22px;color:var(--navy);line-height:1}
    .donut-center small{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
    .dash-stats{flex:1;min-width:180px;display:grid;gap:8px}
    .dash-stat-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:4px 0}
    .dash-stat-label{display:flex;align-items:center;gap:6px}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
    .dot-green{background:#15803d}
    .dot-amber{background:#b45309}
    .dot-red{background:#b91c1c}
    .dash-foot{margin-top:16px;padding-top:12px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center}

    .api-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;text-decoration:none;font-weight:bold}
    .api-connected{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
    .api-disconnected{background:#fef3c7;color:#b45309;border:1px solid #fde68a}

    @media(max-width:1100px){
      .stats{grid-template-columns:repeat(3,1fr)}
      .stat:last-child{grid-column:span 2}
      .dashboard-grid{grid-template-columns:1fr}

    @media(max-width:768px){
      .sidebar{transform:translateX(-100%)}
      .sidebar.open{transform:translateX(0);box-shadow:4px 0 25px rgba(0,0,0,0.3)}
      .main{margin-left:0;width:100%}
      .topbar{padding:0 16px}
      .menu-toggle{display:inline-flex}
      .content{padding:20px 16px}
      .stats{grid-template-columns:1fr 1fr;gap:10px}
      .stat:last-child{grid-column:span 2}
      .intro{flex-direction:column;align-items:stretch}
      .action-buttons{width:100%}
      .action-buttons button{flex:1 1 auto}
      .filters{padding:12px;flex-direction:column;align-items:stretch}
      .search{max-width:none;width:100%;min-width:0}
      .filter-list{display:grid;grid-template-columns:1fr 1fr;width:100%}
      .grid{grid-template-columns:1fr}
      .docs{grid-template-columns:1fr}
      .modal-foot{flex-direction:column-reverse;align-items:stretch}
      .modal-foot > div{display:flex;flex-direction:column-reverse;gap:8px;width:100%}
      .modal-foot button{width:100%}
      .modal header{padding:16px}
      .form{padding:16px}
      .dash-body{flex-direction:column;align-items:flex-start}
    }
    @media(max-width:440px){
      .filter-list{grid-template-columns:1fr}
    }
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .spin{display:inline-block;animation:spin 1s linear infinite}
  </style>
</head>
<body>
<div id="app"></div>
<input type="file" id="excel-file-input" accept=".xlsx, .xls" style="display:none;" onchange="handleExcelFileSelect(this)">
<div id="toast" class="toast hidden"></div>

<script>
// ==========================================================================
// KONFIGURASI API BACKEND GOOGLE APPS SCRIPT (UNTUK GITHUB PAGES)
// ==========================================================================
// Jika aplikasi di-host di GitHub Pages, masukkan URL Web App Google Apps Script Anda di sini.
// Contoh: API_URL: 'https://script.google.com/macros/s/AKfycbwvhL75vGKiCKLOT0ZC3pIAsOHSk0ajFyvJ66tL8ekDG8Z1v5r4usKneBu8DDq_HqB8/exec'
// Jika aplikasi dijalankan langsung di dalam Google Apps Script, biarkan kosong.
const CONFIG = {
  API_URL: ''
};

const isAppsScript = typeof google !== 'undefined' && Boolean(google.script) && Boolean(google.script.run);

// DAFTAR PERUSAHAAN
const COMPANIES_LIST = [
  { key: 'PATRIA', name: 'PATRIA MENARA ABADI', shortName: 'Patria' },
  { key: 'ARRAH', name: 'ARRAH ENERGI INDONESIA', shortName: 'Arrah' },
  { key: 'ABIUMI', name: 'ABIUMI REJEKI BERSAMA', shortName: 'Abiumi' },
  { key: 'LANGGENG', name: 'LANGGENG NIAGA GEMILANG', shortName: 'Langgeng' }
];

// STATE APLIKASI
let currentView = 'TRANSAKSI'; // 'TRANSAKSI' | 'DASHBOARD' | 'HISTORIS'
let currentCompanyKey = 'PATRIA';

// Cache data transaksi per perusahaan
const companyCache = {
  PATRIA: { data: [], loaded: false, loading: false },
  ARRAH: { data: [], loaded: false, loading: false },
  ABIUMI: { data: [], loaded: false, loading: false },
  LANGGENG: { data: [], loaded: false, loading: false }
};

let banks = [];
let filter = { q: '', month: '0', year: 'all', bank: 'all', status: 'all' };
let historisFilter = { q: '', company: 'all' };
let historisData = [];
let isHistorisLoading = false;

let dashboardStats = null;
let isDashboardLoading = false;

let editing = null;
let pendingFiles = {};
let removedDocs = {};
let isSidebarOpen = false;
let loadError = null;
let importedRowsToSave = [];

const $ = id => document.getElementById(id);

function getCompanyObj(key) {
  return COMPANIES_LIST.find(c => c.key === (key || currentCompanyKey)) || COMPANIES_LIST[0];
}

function getActiveCompanyName() {
  return getCompanyObj(currentCompanyKey).name;
}

// ROBUST PARSER NOMINAL MENDUKUNG FORMAT RUPIAH DENGAN TITIK RIBUAN ATAU KOMA DESIMAL
const parseNominal = val => {
  if (typeof val === 'number') return isFinite(val) ? val : NaN;
  if (val === null || val === undefined) return NaN;
  let s = String(val).trim();
  s = s.replace(/^(?:Rp|IDR)\.?\s*/i, '').replace(/\s/g, '');
  if (!s) return NaN;

  if (s.includes('.') && s.includes(',')) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) {
      s = s.replace(/\./g, '').replace(',', '.');
    } else {
      s = s.replace(/,/g, '');
    }
  } else if (s.includes(',')) {
    if ((s.match(/,/g) || []).length > 1) {
      s = s.replace(/,/g, '');
    } else {
      s = s.replace(',', '.');
    }
  } else if (s.includes('.')) {
    if ((s.match(/\./g) || []).length > 1) {
      s = s.replace(/\./g, '');
    } else {
      const parts = s.split('.');
      if (parts[1] && parts[1].length === 3 && parts[0].length >= 1) {
        s = s.replace('.', '');
      }
    }
  }

  const num = Number(s);
  return isFinite(num) ? num : NaN;
};

const formatAmountInput = val => {
  if (val === null || val === undefined || val === '') return '';
  const num = parseNominal(val);
  if (isNaN(num)) return String(val);
  if (num % 1 !== 0) {
    return String(num).replace('.', ',');
  }
  return String(num);
};

const rupiah = value => {
  const num = parseNominal(value);
  if (isNaN(num)) return 'Rp 0';
  const hasDecimal = (num % 1 !== 0);
  return new Intl.NumberFormat('id-ID', {
    style: 'currency',
    currency: 'IDR',
    minimumFractionDigits: hasDecimal ? 2 : 0,
    maximumFractionDigits: 2
  }).format(num);
};

const escapeHtml = str => String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');

const toast = message => {
  const el = $('toast');
  if (!el) return;
  el.textContent = message;
  el.classList.remove('hidden');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.add('hidden'), 3500);
};

function getActiveApiUrl() {
  if (typeof window !== 'undefined' && window.location) {
    const urlParam = new URLSearchParams(window.location.search).get('api');
    if (urlParam) {
      try { localStorage.setItem('VERIFIKASI_API_URL', urlParam); } catch (e) {}
      return urlParam;
    }
  }
  return CONFIG.API_URL || (typeof localStorage !== 'undefined' ? localStorage.getItem('VERIFIKASI_API_URL') : '') || '';
}

function setApiUrl(newUrl) {
  const trimmed = String(newUrl || '').trim();
  if (typeof localStorage !== 'undefined') {
    if (trimmed) {
      localStorage.setItem('VERIFIKASI_API_URL', trimmed);
    } else {
      localStorage.removeItem('VERIFIKASI_API_URL');
    }
  }
  toast(trimmed ? 'URL Backend Google Apps Script disimpan.' : 'URL Backend direset.');
  closeApiModal();
  render();
  loadCurrentCompanyData(true);
}

// ADAPTER KOMUNIKASI UNIVERSAL (GOOGLE APPS SCRIPT & GITHUB PAGES)
function call(name, args = []) {
  if (isAppsScript) {
    return new Promise((resolve, reject) => {
      if (!google.script.run || !google.script.run[name]) {
        return reject(new Error('Fungsi ' + name + ' tidak tersedia pada Google Apps Script.'));
      }
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(error))[name](...args);
    });
  }

  const url = getActiveApiUrl();
  if (!url) {
    return Promise.reject(new Error('URL Backend API belum dikonfigurasi. Silakan klik tombol Sambungkan API di pojok kanan atas.'));
  }

  // Gunakan POST dengan text/plain untuk bypass CORS preflight pada Google Apps Script Web App
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: name, args: args })
  })
    .then(res => {
      if (!res.ok) throw new Error('HTTP Error: ' + res.status);
      return res.json();
    })
    .then(res => {
      if (!res.success) throw new Error(res.error || 'Terjadi kesalahan pada backend.');
      return res.data;
    })
    .catch(err => {
      // Fallback otomatis ke GET untuk aksi pembacaan data jika browser mengalami redirect issue pada POST
      const readActions = ['getDashboardStats', 'getHistorisData', 'getBanks', 'getData'];
      if (readActions.includes(name)) {
        let queryUrl = url + (url.includes('?') ? '&' : '?') + 'action=' + encodeURIComponent(name);
        if (name === 'getData' && args[0]) {
          queryUrl += '&company=' + encodeURIComponent(args[0]);
        }
        return fetch(queryUrl)
          .then(res => res.json())
          .then(res => {
            if (!res.success) throw new Error(res.error || 'Gagal memuat data dari backend.');
            return res.data;
          });
      }
      throw err;
    });
}

function getDeviceInfo() {
  const ua = navigator.userAgent || '';
  let browser = 'Unknown Browser';
  if (ua.includes('Edg/')) browser = 'Microsoft Edge';
  else if (ua.includes('Chrome/')) browser = 'Google Chrome';
  else if (ua.includes('Safari/') && !ua.includes('Chrome/')) browser = 'Apple Safari';
  else if (ua.includes('Firefox/')) browser = 'Mozilla Firefox';

  let os = 'Unknown OS';
  if (ua.includes('Win')) os = 'Windows';
  else if (ua.includes('Mac')) os = 'macOS';
  else if (ua.includes('Linux')) os = 'Linux';
  else if (ua.includes('Android')) os = 'Android';
  else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';

  const isMobile = /Mobi|Android|iPhone|iPad/i.test(ua);
  const type = isMobile ? 'Mobile' : 'Desktop';
  return `${browser} / ${os} / ${type}`;
}

function getCurrentData() {
  return companyCache[currentCompanyKey] ? companyCache[currentCompanyKey].data : [];
}

function getFilteredData() {
  const dataset = getCurrentData();
  return dataset.filter(t => {
    const d = new Date(t.tanggalTransaksi);
    return (!filter.q || t.noTransaksi.toLowerCase().includes(filter.q) || t.namaBank.toLowerCase().includes(filter.q) || (t.keterangan && t.keterangan.toLowerCase().includes(filter.q)))
      && (filter.month === '0' || String(d.getMonth() + 1) === filter.month)
      && (filter.year === 'all' || t.tanggalTransaksi.startsWith(filter.year))
      && (filter.bank === 'all' || t.namaBank === filter.bank)
      && (filter.status === 'all' || t.statusBukti === filter.status);
  }).sort((a, b) => b.tanggalTransaksi.localeCompare(a.tanggalTransaksi));
}

function getFilteredHistoris() {
  return historisData.filter(h => {
    const q = historisFilter.q;
    const matchQ = !q || h.noTransaksi.toLowerCase().includes(q) || h.perusahaan.toLowerCase().includes(q) || h.namaBank.toLowerCase().includes(q) || (h.keterangan && h.keterangan.toLowerCase().includes(q)) || h.email.toLowerCase().includes(q) || h.timestamp.toLowerCase().includes(q);
    const matchCompany = historisFilter.company === 'all' || h.perusahaan.toUpperCase().includes(historisFilter.company);
    return matchQ && matchCompany;
  });
}

// MEMBUAT DONUT SVG DENGAN PERHITUNGAN AKURAT
function createSvgDonut(pctLengkap, pctSebagian, pctTidakAda) {
  const radius = 46;
  const circumference = 2 * Math.PI * radius; // ~289.02
  
  const lenStroke = (pctLengkap / 100) * circumference;
  const sebStroke = (pctSebagian / 100) * circumference;
  const tidStroke = (pctTidakAda / 100) * circumference;

  const lenOffset = 0;
  const sebOffset = -lenStroke;
  const tidOffset = -(lenStroke + sebStroke);

  return `
    <svg width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg);">
      <circle cx="60" cy="60" r="${radius}" fill="none" stroke="#f1f5f9" stroke-width="12" />
      ${pctLengkap > 0 ? `<circle cx="60" cy="60" r="${radius}" fill="none" stroke="#15803d" stroke-width="12" stroke-dasharray="${lenStroke} ${circumference - lenStroke}" stroke-dashoffset="${lenOffset}" stroke-linecap="round" />` : ''}
      ${pctSebagian > 0 ? `<circle cx="60" cy="60" r="${radius}" fill="none" stroke="#b45309" stroke-width="12" stroke-dasharray="${sebStroke} ${circumference - sebStroke}" stroke-dashoffset="${sebOffset}" stroke-linecap="round" />` : ''}
      ${pctTidakAda > 0 ? `<circle cx="60" cy="60" r="${radius}" fill="none" stroke="#b91c1c" stroke-width="12" stroke-dasharray="${tidStroke} ${circumference - tidStroke}" stroke-dashoffset="${tidOffset}" stroke-linecap="round" />` : ''}
    </svg>
  `;
}

function docForm(key, label, doc) {

      ` : ''}

      <input id="${key}-file" type="file" accept=".jpg,.jpeg,.png,.pdf" onchange="handleFileSelect('${key}', this)">

      <div class="doc-sep">atau</div>
      <div class="doc-label">Link Google Drive</div>
      <input id="${key}-link" type="text" placeholder="Tempel link Google Drive" value="${hasDoc && (!doc.fileId || !doc.fileName) ? escapeHtml(docUrl) : ''}" oninput="handleLinkInput('${key}')">
    </div>

function handleLinkInput(key) {
  delete removedDocs[key];
}

function removeDoc(key) {
  removedDocs[key] = true;
  delete pendingFiles[key];
  const currentEl = $(key + '-current');
  if (currentEl) currentEl.style.display = 'none';
  const fileInput = $(key + '-file');
  if (fileInput) fileInput.value = '';
  const infoEl = $(key + '-file-info');
  if (infoEl) infoEl.innerHTML = '<span style="color:var(--muted)">Dokumen ditandai untuk dihapus</span>';
  const linkInput = $(key + '-link');
  if (linkInput) linkInput.value = '';
}

function handleFileSelect(key, input) {
  const file = input.files && input.files[0];
  const infoEl = $(key + '-file-info');
  if (!file) {
    delete pendingFiles[key];
    if (infoEl) infoEl.textContent = '';
    return;
  }
  const ext = file.name.slice(file.name.lastIndexOf('.')).toLowerCase();
  const allowedExts = ['.jpg', '.jpeg', '.png', '.pdf'];
  if (!allowedExts.includes(ext)) {
    input.value = '';
    delete pendingFiles[key];
    if (infoEl) infoEl.textContent = '';
    toast('Format file tidak didukung. Gunakan JPG, JPEG, PNG, atau PDF.');
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    input.value = '';
    delete pendingFiles[key];
    if (infoEl) infoEl.textContent = '';
    toast('Ukuran file terlalu besar. Maksimal 10 MB.');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    pendingFiles[key] = {
      fileName: file.name,
      mimeType: file.type || (ext === '.pdf' ? 'application/pdf' : ext === '.png' ? 'image/png' : 'image/jpeg'),
      base64: e.target.result
    };
    delete removedDocs[key];
    if (infoEl) {
      infoEl.innerHTML = `<span style="color:var(--green)">✓ ${escapeHtml(file.name)}</span>`;
    }
  };
  reader.onerror = function() {
    input.value = '';
    delete pendingFiles[key];
    if (infoEl) infoEl.textContent = '';
    toast('Gagal membaca file dari device.');
  };
  reader.readAsDataURL(file);
}

function closeModal() {
  const m = $('modal');
  if (m) m.remove();
  editing = null;
  pendingFiles = {};
  removedDocs = {};
}

// PROSES SAVE YANG CEPAT & OPTIMAL TANPA REFRESH
function save(event) {
  event.preventDefault();
  const noTransaksi = $('f-no').value.trim();
  const namaBank = $('f-bank').value.trim();
  const tanggalTransaksi = $('f-date').value.trim();
  const keterangan = $('f-desc') ? $('f-desc').value.trim() : '';
  const rawAmount = $('f-amount') ? $('f-amount').value.trim() : '';
  const jumlahTransaksi = parseNominal(rawAmount);

  if (!noTransaksi || !namaBank || !tanggalTransaksi || isNaN(jumlahTransaksi) || jumlahTransaksi <= 0) {
    toast('Mohon lengkapi semua field yang wajib diisi dengan benar.');
    return;
  }

  const payload = {
    noTransaksi: noTransaksi,
    namaBank: namaBank,
    tanggalTransaksi: tanggalTransaksi,
    keterangan: keterangan,
    jumlahTransaksi: jumlahTransaksi
  };

  ['buktiPengajuan', 'buktiBayar', 'invoice'].forEach(key => {
    const fileData = pendingFiles[key];
    const linkVal = $(key + '-link') ? $(key + '-link').value.trim() : '';

    if (fileData && fileData.base64) {
      payload[key] = {
        fileName: fileData.fileName,
        mimeType: fileData.mimeType,
        base64: fileData.base64
      };
    } else if (linkVal) {
      payload[key] = {
        url: linkVal,
        name: 'Link Google Drive'
      };
    } else if (removedDocs[key]) {
      payload[key] = null;
    } else if (editing && editing[key]) {
      payload[key] = editing[key];
    } else {
      payload[key] = null;
    }
  });

  const saveBtn = $('btn-save');
  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spin">⟳</span> Menyimpan...';
  }

  const targetCompanyKey = currentCompanyKey;
  const isEditing = Boolean(editing);
  const fn = isEditing ? 'updateTransaction' : 'addTransaction';
  const args = isEditing ? [editing.noTransaksi, payload, targetCompanyKey] : [payload, targetCompanyKey];

  call(fn, args).then(result => {
    const currentDataset = companyCache[targetCompanyKey] ? companyCache[targetCompanyKey].data : [];
    if (isEditing) {
      companyCache[targetCompanyKey].data = currentDataset.map(t => t.noTransaksi === editing.noTransaksi ? result : t);
    } else {
      companyCache[targetCompanyKey].data = [result, ...currentDataset];
    }
    
    closeModal();
    render();
    toast(`Data transaksi berhasil disimpan ke ${getCompanyObj(targetCompanyKey).name}.`);
    dashboardStats = null;
  }).catch(error => {
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Simpan';
    }
    toast(error && error.message ? error.message : 'Gagal menyimpan data.');
  });
}

function openImportDialog() {

    fileInput.value = '';

function handleExcelFileSelect(input) {
  const file = input.files && input.files[0];
  if (!file) return;

  if (typeof XLSX === 'undefined') {
    toast('Library Excel sedang dimuat. Silakan coba kembali dalam beberapa detik.');
    input.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const dataBytes = new Uint8Array(e.target.result);
      const workbook = XLSX.read(dataBytes, { type: 'array', cellDates: true });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, dateNF: 'yyyy-mm-dd' });
      processImportData(rawRows);
    } catch (err) {
      toast('Gagal membaca file Excel: ' + (err.message || String(err)));
    }
    input.value = '';
  };
  reader.onerror = function() {
    toast('Gagal membaca file dari komputer.');
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}

// ROBUST EXCEL DATE PARSER MENDUKUNG DATE OBJECT, SERIAL NUMBER, DAN TEKS TANGGAL
function parseExcelDate(val) {
  if (!val) return '';
  if (val instanceof Date && !isNaN(val.getTime())) {
    const y = val.getFullYear();
    const m = String(val.getMonth() + 1).padStart(2, '0');
    const d = String(val.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  if (typeof val === 'number' && val > 1000 && val < 100000) {
    const d = new Date(Math.round((val - 25569) * 86400 * 1000));
    if (!isNaN(d.getTime())) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
  }

  const str = String(val).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  if (/^\d{4}\/\d{2}\/\d{2}$/.test(str)) return str.replace(/\//g, '-');

  // Format DD/MM/YYYY atau DD-MM-YYYY
  const dmy = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (dmy) {
    const day = dmy[1].padStart(2, '0');
    const month = dmy[2].padStart(2, '0');
    const year = dmy[3];
    return `${year}-${month}-${day}`;
  }

  // Format DD/MM/YY (2 digit tahun)
  const dmyShort = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2})$/);
  if (dmyShort) {
    const day = dmyShort[1].padStart(2, '0');
    const month = dmyShort[2].padStart(2, '0');
    const year = '20' + dmyShort[3];
    return `${year}-${month}-${day}`;
  }

  // Cek serial number dalam format string
  if (/^\d{5}$/.test(str)) {
    const num = Number(str);
    const d = new Date(Math.round((num - 25569) * 86400 * 1000));
    if (!isNaN(d.getTime())) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
  }

  const parsed = new Date(str);
  if (!isNaN(parsed.getTime())) {
    const y = parsed.getFullYear();
    const m = String(parsed.getMonth() + 1).padStart(2, '0');
    const d = String(parsed.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }
  return '';
}

function processImportData(sheetRows) {
  if (!sheetRows || sheetRows.length < 2) {
    toast('File Excel tidak berisi data transaksi atau hanya header.');
    return;
  }

  let headerIndex = -1;
  let colMap = {};

  // Deteksi baris header secara fleksibel pada 10 baris pertama
  for (let r = 0; r < Math.min(sheetRows.length, 10); r++) {
    const row = sheetRows[r];
    if (!Array.isArray(row)) continue;
    const lowerHeaders = row.map(cell => String(cell || '').trim().toLowerCase());
    
    let noIdx = lowerHeaders.findIndex(h => /transaksi|no.*trans|nomor.*trans|no_trans|kode.*trans|no\.?\s*bukti/i.test(h) && !/jumlah|nilai|tanggal|status/i.test(h));
    let bankIdx = lowerHeaders.findIndex(h => /bank/i.test(h));
    let tglIdx = lowerHeaders.findIndex(h => /tanggal|tgl|date/i.test(h));
    let jmlIdx = lowerHeaders.findIndex(h => /jumlah|nominal|amount|nilai|total|debit|kredit/i.test(h));

    if (noIdx !== -1 && (bankIdx !== -1 || tglIdx !== -1 || jmlIdx !== -1)) {
      headerIndex = r;
      colMap = {
        noTransaksi: noIdx,
        namaBank: bankIdx,
        tanggalTransaksi: tglIdx,
        keterangan: lowerHeaders.findIndex(h => /keterangan|deskripsi|uraian|catatan|notes|perihal/i.test(h)),
        jumlahTransaksi: jmlIdx,
        buktiPengajuan: lowerHeaders.findIndex(h => /pengajuan|bukti.*transaksi|bukti.*pengajuan/i.test(h)),
        buktiBayar: lowerHeaders.findIndex(h => /bayar|bukti.*bayar/i.test(h)),
        invoice: lowerHeaders.findIndex(h => /invoice|faktur|tagihan/i.test(h)),
        status: lowerHeaders.findIndex(h => /status/i.test(h))
      };
      break;
    }
  }

  if (headerIndex === -1) {
    headerIndex = 0;
    colMap = {
      noTransaksi: 0,
      namaBank: 1,
      tanggalTransaksi: 2,
      keterangan: 3,
      jumlahTransaksi: 4,
      buktiPengajuan: 5,
      buktiBayar: 6,
      invoice: 7,
      status: 8
    };
  }

  // Ambil No Transaksi yang sudah ada pada perusahaan aktif
  const existingNoSet = new Set(getCurrentData().map(t => String(t.noTransaksi || '').trim().toLowerCase()));
  const batchNoSet = new Set();
  const parsedRows = [];

  for (let r = headerIndex + 1; r < sheetRows.length; r++) {
    const row = sheetRows[r];
    if (!row || !row.some(cell => String(cell || '').trim())) continue;

    let noTransaksi = colMap.noTransaksi !== -1 ? row[colMap.noTransaksi] : '';
    if (typeof noTransaksi === 'number') {
      noTransaksi = Math.floor(noTransaksi) === noTransaksi ? String(Math.floor(noTransaksi)) : String(noTransaksi);
    } else {
      noTransaksi = String(noTransaksi || '').trim();
    }

    const namaBank = colMap.namaBank !== -1 ? String(row[colMap.namaBank] || '').trim() : '';
    const rawDate = colMap.tanggalTransaksi !== -1 ? row[colMap.tanggalTransaksi] : '';
    const tanggalTransaksi = parseExcelDate(rawDate);
    const keterangan = colMap.keterangan !== -1 ? String(row[colMap.keterangan] || '').trim() : '';
    const rawAmount = colMap.jumlahTransaksi !== -1 ? row[colMap.jumlahTransaksi] : '';
    const jumlahTransaksi = parseNominal(rawAmount);

    const pengajuan = colMap.buktiPengajuan !== -1 ? String(row[colMap.buktiPengajuan] || '').trim() : '';
    const bayar = colMap.buktiBayar !== -1 ? String(row[colMap.buktiBayar] || '').trim() : '';
    const inv = colMap.invoice !== -1 ? String(row[colMap.invoice] || '').trim() : '';

    let error = null;
    if (!noTransaksi) {
      error = 'No Transaksi kosong';
    } else if (existingNoSet.has(noTransaksi.toLowerCase())) {
      error = 'No Transaksi sudah ada di ' + getCompanyObj(currentCompanyKey).shortName;
    } else if (batchNoSet.has(noTransaksi.toLowerCase())) {
      error = 'No Transaksi duplikat di file Excel';
    } else if (!namaBank) {
      error = 'Nama Bank kosong';
    } else if (!tanggalTransaksi) {
      error = 'Tanggal transaksi tidak valid';
    } else if (isNaN(jumlahTransaksi) || jumlahTransaksi <= 0) {
      error = 'Nominal transaksi tidak valid';
    }

    if (!error) {
      batchNoSet.add(noTransaksi.toLowerCase());
    }

    parsedRows.push({
      rowNum: r + 1,
      noTransaksi,
      namaBank,
      tanggalTransaksi,
      keterangan,
      jumlahTransaksi: isNaN(jumlahTransaksi) ? 0 : jumlahTransaksi,
      buktiPengajuan: pengajuan || null,
      buktiBayar: bayar || null,
      invoice: inv || null,
      isValid: !error,
      errorMsg: error
    });
  }

  if (!parsedRows.length) {
    toast('Tidak ada data baris transaksi yang dapat dibaca.');
    return;
  }

  showImportPreviewModal(parsedRows);
}

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-bg" id="import-modal" onclick="if(event.target===this)closeImportModal()">
      <div class="modal modal-lg">
        <header>
          <div>
            <div class="eyebrow">IMPORT TRANSAKSI EXCEL — ${escapeHtml(getActiveCompanyName())}</div>
            <h2>Pratinjau Data Import (${parsedRows.length} Baris Terbaca)</h2>
          </div>
          <button class="close" type="button" onclick="closeImportModal()">×</button>
        </header>
        <div class="form">
          <div class="preview-summary">
            <div class="summary-badge summary-valid">✓ ${validCount} Transaksi Siap Disimpan ke ${escapeHtml(getCompanyObj(currentCompanyKey).shortName)}</div>
            ${invalidCount > 0 ? `<div class="summary-badge summary-invalid">⚠ ${invalidCount} Data Tidak Valid (Akan Dilewati)</div>` : ''}
            <div style="font-size:11px;color:var(--muted);margin-left:auto;">Perusahaan Tujuan: <b>${escapeHtml(getActiveCompanyName())}</b></div>
          </div>
          <div class="table-scroll" style="max-height:360px;border:1px solid var(--line);border-radius:8px;">
            <table>
              <thead>
                <tr>
                  <th>No</th>
                  <th>No Transaksi</th>
                  <th>Nama Bank</th>
                  <th>Tanggal</th>
                  <th>Keterangan</th>
                  <th>Jumlah</th>
                  <th>Status Validasi</th>
                </tr>
              </thead>
              <tbody>
                ${previewTableRows}
              </tbody>
            </table>
          </div>
          ${parsedRows.length > 100 ? `<p style="font-size:11px;color:var(--muted);margin:8px 0 0;">Menampilkan 100 data pertama dari total ${parsedRows.length} data.</p>` : ''}
          <div class="modal-foot" style="padding:16px 0 0;margin-top:16px;">
            <span style="font-size:11px;color:var(--muted)">Data akan langsung dikirim secara batch ke sheet ${escapeHtml(getCompanyObj(currentCompanyKey).shortName)}</span>
            <div style="display:flex;gap:8px;">
              <button type="button" class="secondary" onclick="closeImportModal()">Batal</button>
              <button type="button" class="primary" id="btn-save-import" onclick="saveImportedData()" ${validCount === 0 ? 'disabled' : ''}>Simpan ${validCount} Data ke Spreadsheet</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  `);
}

function closeImportModal() {
  const m = $('import-modal');
  if (m) m.remove();
  importedRowsToSave = [];
}

// BATCH SAVE IMPORT TRANSAKSI SECARA CEPAT DALAM SATU REQUEST
function saveImportedData() {
  if (!importedRowsToSave.length) {
    toast('Tidak ada data valid untuk disimpan.');
    return;
  }
  const btn = $('btn-save-import');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spin">⟳</span> Menyimpan ke Google Sheets...';
  }

  const targetCompKey = currentCompanyKey;
  const payloadRows = importedRowsToSave.map(r => ({
    noTransaksi: r.noTransaksi,
    namaBank: r.namaBank,
    tanggalTransaksi: r.tanggalTransaksi,
    keterangan: r.keterangan,
    jumlahTransaksi: r.jumlahTransaksi,
    buktiPengajuan: r.buktiPengajuan,
    buktiBayar: r.buktiBayar,
    invoice: r.invoice
  }));

  call('importTransactions', [payloadRows, targetCompKey]).then(result => {
    if (Array.isArray(result) && result.length) {
      const existing = companyCache[targetCompKey] ? companyCache[targetCompKey].data : [];
      companyCache[targetCompKey].data = [...result, ...existing];
    }
    closeImportModal();
    render();
    toast(`Berhasil mengimpor ${payloadRows.length} transaksi ke ${getCompanyObj(targetCompKey).name}.`);
    dashboardStats = null;
  }).catch(err => {
    if (btn) {
      btn.disabled = false;
      btn.textContent = `Simpan ${importedRowsToSave.length} Data ke Spreadsheet`;
    }
    toast('Gagal menyimpan import: ' + (err.message || String(err)));
  });
}

// ==========================================================================
// FITUR EXPORT EXCEL & PDF (BERDASARKAN PERUSAHAAN AKTIF)
// ==========================================================================
function getFilterSummaryLabels() {
  const monthNames = ['', 'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const bankLabel = filter.bank === 'all' ? 'Semua Bank' : filter.bank;
  let periodeLabel = 'Semua Periode';
  if (filter.month !== '0' && filter.year !== 'all') {
    periodeLabel = `${monthNames[Number(filter.month)]} ${filter.year}`;
  } else if (filter.month !== '0') {
    periodeLabel = `Bulan ${monthNames[Number(filter.month)]}`;
  } else if (filter.year !== 'all') {
    periodeLabel = `Tahun ${filter.year}`;
  }
  const tanggalCetak = new Intl.DateTimeFormat('id-ID', { dateStyle: 'long', timeStyle: 'short' }).format(new Date());
  return { bankLabel, periodeLabel, tanggalCetak };
}

function exportToExcel() {
  const filtered = getFilteredData();
  const compName = getActiveCompanyName();

  if (!filtered.length) {
    toast('Tidak ada data untuk diexport.');
    return;
  }
  if (typeof XLSX === 'undefined') {
    toast('Library Excel belum siap. Silakan muat ulang halaman.');
    return;
  }

  const { bankLabel, periodeLabel, tanggalCetak } = getFilterSummaryLabels();
  const total = filtered.reduce((s, t) => s + (parseNominal(t.jumlahTransaksi) || 0), 0);

  const aoa = [
    [compName],
    ['LAPORAN VERIFIKASI FILLING'],
    [`Bank: ${bankLabel}   |   Periode: ${periodeLabel}   |   Tanggal Unduh: ${tanggalCetak}   |   Total Data: ${filtered.length} Transaksi`],
    [],
    ['No', 'No. Transaksi', 'Nama Bank', 'Tanggal Transaksi', 'Keterangan', 'Jumlah Transaksi', 'Bukti Pengajuan', 'Bukti Bayar', 'Invoice', 'Status Bukti']
  ];

  filtered.forEach((t, index) => {
    const amt = parseNominal(t.jumlahTransaksi) || 0;
    aoa.push([
      index + 1,
      t.noTransaksi,
      t.namaBank,
      t.tanggalTransaksi,
      t.keterangan || '',
      amt,
      t.buktiPengajuan ? (t.buktiPengajuan.fileName || t.buktiPengajuan.name || 'Ada Dokumen') : '-',
      t.buktiBayar ? (t.buktiBayar.fileName || t.buktiBayar.name || 'Ada Dokumen') : '-',
      t.invoice ? (t.invoice.fileName || t.invoice.name || 'Ada Dokumen') : '-',
      t.statusBukti
    ]);
  });

  aoa.push(['', '', '', '', 'TOTAL', total, '', '', '', '']);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [
    { wch: 6 },
    { wch: 22 },
    { wch: 18 },
    { wch: 16 },
    { wch: 32 },
    { wch: 20 },
    { wch: 22 },
    { wch: 22 },
    { wch: 22 },
    { wch: 18 }
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Laporan Verifikasi');
  const sanitizedCompName = compName.replace(/\s+/g, '_');
  const filename = `Laporan_Verifikasi_${sanitizedCompName}_${filter.bank === 'all' ? 'SemuaBank' : filter.bank}_${filter.year === 'all' ? 'SemuaTahun' : filter.year}.xlsx`;
  XLSX.writeFile(wb, filename);
  toast(`File Excel ${compName} berhasil diunduh.`);
}

function exportToPdf() {
  const filtered = getFilteredData();
  const compName = getActiveCompanyName();

  if (!filtered.length) {
    toast('Tidak ada data untuk diexport.');
    return;
  }
  if (typeof window.jspdf === 'undefined' || !window.jspdf.jsPDF) {
    toast('Library PDF belum siap. Silakan periksa koneksi internet.');
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const { bankLabel, periodeLabel, tanggalCetak } = getFilterSummaryLabels();
  const total = filtered.reduce((s, t) => s + (parseNominal(t.jumlahTransaksi) || 0), 0);

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(15);
  doc.setTextColor(15, 23, 42);
  doc.text(compName, 14, 15);

  doc.setFontSize(11);
  doc.setTextColor(37, 99, 235);
  doc.text('LAPORAN VERIFIKASI FILLING', 14, 21);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8.5);
  doc.setTextColor(100, 116, 139);
  doc.text(`Bank: ${bankLabel}   |   Periode: ${periodeLabel}   |   Tanggal Cetak: ${tanggalCetak}   |   Total: ${filtered.length} Transaksi`, 14, 27);

  const tableBody = filtered.map((t, index) => [
    index + 1,
    t.noTransaksi,
    t.namaBank,
    t.tanggalTransaksi,
    t.keterangan || '-',
    rupiah(t.jumlahTransaksi),
    t.buktiPengajuan ? 'Ada' : '-',
    t.buktiBayar ? 'Ada' : '-',
    t.invoice ? 'Ada' : '-',
    t.statusBukti
  ]);

  doc.autoTable({
    startY: 31,
    head: [['No', 'No. Transaksi', 'Bank', 'Tanggal', 'Keterangan', 'Jumlah Transaksi', 'Pengajuan', 'Bayar', 'Invoice', 'Status']],
    body: tableBody,
    foot: [['', '', '', '', 'TOTAL', rupiah(total), '', '', '', '']],
    theme: 'grid',
    styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
    headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255], fontStyle: 'bold' },
    footStyles: { fillColor: [241, 245, 249], textColor: [15, 23, 42], fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [248, 250, 252] },
    columnStyles: {
      0: { cellWidth: 10, halign: 'center' },
      1: { cellWidth: 32 },
      2: { cellWidth: 24 },
      3: { cellWidth: 22 },
      4: { cellWidth: 50 },
      5: { cellWidth: 34, halign: 'right' },
      6: { cellWidth: 20, halign: 'center' },
      7: { cellWidth: 20, halign: 'center' },
      8: { cellWidth: 20, halign: 'center' },
      9: { cellWidth: 34, halign: 'center' }
    }
  });

  const sanitizedCompName = compName.replace(/\s+/g, '_');
  const filename = `Laporan_Verifikasi_${sanitizedCompName}_${filter.bank === 'all' ? 'SemuaBank' : filter.bank}_${filter.year === 'all' ? 'SemuaTahun' : filter.year}.pdf`;
  doc.save(filename);
  toast(`File PDF ${compName} berhasil diunduh.`);
}

  filtered.forEach((h, idx) => {

// ==========================================================================
// DATA LOADERS & INITIALIZATION
// ==========================================================================
function loadCurrentCompanyData(forceReload = false) {
  const compKey = currentCompanyKey;
  if (!isAppsScript && !getActiveApiUrl()) {
    companyCache[compKey] = { data: [], loaded: true, loading: false };
    render();
    return;
  }

  if (!forceReload && companyCache[compKey].loaded) {
    render();
    return;
  }

  companyCache[compKey].loading = true;
  loadError = null;
  render();

  Promise.all([
    call('getData', [compKey]),
    banks.length ? Promise.resolve(banks) : call('getBanks')
  ]).then(([txList, bankList]) => {
    companyCache[compKey] = {
      data: txList || [],
      loaded: true,
      loading: false
    };
    if (Array.isArray(bankList) && bankList.length) {
      banks = bankList;
    }
    loadError = null;
    render();
  }).catch(error => {
    companyCache[compKey].loading = false;
    loadError = error && error.message ? error.message : 'Gagal terhubung ke server.';
    render();
    toast('Gagal memuat data: ' + (error && error.message ? error.message : 'Koneksi error'));
  });
}

function loadDashboardStats() {
  if (!isAppsScript && !getActiveApiUrl()) {
    dashboardStats = null;
    isDashboardLoading = false;
    render();
    return;
  }

  isDashboardLoading = true;
  render();

  call('getDashboardStats').then(res => {
    dashboardStats = res;
    isDashboardLoading = false;
    render();
  }).catch(err => {
    isDashboardLoading = false;
    render();
    toast('Gagal memuat statistik dashboard: ' + (err && err.message ? err.message : 'Error'));
  });
}

function loadHistorisData() {
  if (!isAppsScript && !getActiveApiUrl()) {
    historisData = [];
    isHistorisLoading = false;
    render();
    return;
  }

  isHistorisLoading = true;
  render();

  call('getHistorisData').then(res => {
    historisData = Array.isArray(res) ? res : [];
    isHistorisLoading = false;
    render();
  }).catch(err => {
    isHistorisLoading = false;
    render();
    toast('Gagal memuat data historis: ' + (err && err.message ? err.message : 'Error'));
  });
}

// 1. Render antarmuka langsung tanpa menunggu backend (instant UI, no blank screen)
render();

// 2. Muat data perusahaan aktif di latar belakang secara asinkron
loadCurrentCompanyData();
