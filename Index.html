<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verifikasi Filling</title>
  <style>
    :root{--navy:#0f172a;--blue:#2563eb;--bg:#f8fafc;--line:#e2e8f0;--text:#162033;--muted:#64748b;--green:#15803d;--amber:#b45309;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:244px;padding:28px 16px;background:var(--navy);color:#cbd5e1;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 38px}.brand-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#2563eb;color:#fff;font-size:20px}.brand strong{display:block;color:#fff;letter-spacing:2px;font-size:14px}.brand small{color:#38bdf8;letter-spacing:3px}.side-label{padding:0 11px 10px;color:#64748b;font-size:10px;letter-spacing:2px}.nav{display:grid;gap:6px}.nav button{border:0;border-radius:9px;padding:12px;color:#94a3b8;background:transparent;text-align:left}.nav button.active,.nav button:hover{color:#fff;background:#1e293b;box-shadow:inset 3px 0 #38bdf8}.side-bottom{margin-top:auto}.secure,.user{border-top:1px solid #1e293b;padding:13px 8px;color:#94a3b8;font-size:10px}.secure{border:1px solid #1e293b;border-radius:9px}.secure b,.user b{color:#cbd5e1}.user{display:flex;gap:8px;margin-top:17px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#164e63;color:#e0f2fe}.main{margin-left:244px;min-height:100vh}.topbar{height:76px;padding:0 36px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.eyebrow,.kicker{font-size:10px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:#94a3b8}.topbar h1{margin:5px 0 0;font-size:23px}.today{color:var(--muted);font-size:11px}.content{padding:30px 36px}.intro{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.intro h2{margin:8px 0 4px;font-size:22px}.intro p{margin:0;color:var(--muted);font-size:12px}.primary{border:0;border-radius:8px;padding:11px 15px;background:var(--blue);color:white;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:19px}.stat,.panel,.table-wrap{border:1px solid var(--line);border-radius:11px;background:#fff;box-shadow:0 3px 12px #0f172a08}.stat{padding:16px;min-height:103px}.stat small,.stat span{display:block;color:var(--muted);font-size:10px}.stat strong{display:block;margin:10px 0;font-size:21px}.filters{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px;margin-bottom:18px}.search{flex:1;max-width:360px}.search input,.filters select,.form input,.form select{border:1px solid var(--line);border-radius:7px;background:#f8fafc;padding:9px 10px;outline:0}.search input{width:100%}.filter-list{display:flex;gap:8px;flex-wrap:wrap}.filter-list label{display:grid;gap:4px;color:#94a3b8;font-size:9px;font-weight:bold}.table-head{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid #eef2f7}.table-head h3{margin:6px 0 0;font-size:16px}.table-scroll{overflow:auto}table{width:100%;min-width:1000px;border-collapse:collapse}th,td{padding:11px 10px;border-bottom:1px solid #f1f5f9;text-align:left;white-space:nowrap}th{color:#94a3b8;background:#fbfdff;font-size:9px;text-transform:uppercase}td{font-size:11px;color:#475569}.amount{text-align:right}.badge{border-radius:999px;padding:5px 8px;font-size:9px;font-weight:bold}.complete{color:var(--green);background:#dcfce7}.partial{color:var(--amber);background:#fef3c7}.empty{color:var(--red);background:#fee2e2}.doc{color:var(--blue);text-decoration:none;font-size:10px}.missing{color:#cbd5e1;font-size:10px}.actions{display:flex;gap:5px}.actions button{border:0;border-radius:6px;padding:7px}.edit{color:var(--blue);background:#eff6ff}.delete{color:var(--red);background:#fef2f2}.footer{display:flex;justify-content:space-between;padding:13px 18px;color:#94a3b8;font-size:10px}.page{border:1px solid var(--line);background:#fff;padding:7px;border-radius:6px}.notice{margin-top:15px;padding:11px;border:1px solid #bae6fd;border-radius:8px;background:#f0f9ff;color:#0369a1;font-size:10px}.empty-state{text-align:center;padding:45px;color:var(--muted)}.modal-bg{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#0f172a88}.modal{width:min(680px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:14px;background:white}.modal header{display:flex;justify-content:space-between;padding:22px;border-bottom:1px solid var(--line)}.modal header h2{margin:6px 0;font-size:20px}.close{border:0;background:transparent;font-size:20px;color:var(--muted)}.form{padding:20px 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form label{display:grid;gap:6px;color:#475569;font-size:11px;font-weight:bold}.form label em{color:red}.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.doc-box{padding:11px;border:1px solid var(--line);border-radius:8px;background:#fbfdff}.doc-box h4{margin:0 0 8px;font-size:11px}.doc-box input[type=file]{width:100%;font-size:9px}.doc-box input[type=text]{width:100%;margin-top:8px}.modal-foot{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-top:1px solid var(--line)}.secondary{border:1px solid var(--line);border-radius:7px;padding:9px 13px;background:#fff}.danger{border:0;border-radius:7px;padding:9px 13px;color:white;background:#dc2626}.toast{position:fixed;right:20px;top:20px;z-index:50;padding:13px 16px;border-radius:8px;color:#fff;background:#0f172a;box-shadow:0 10px 25px #0f172a30}.hidden{display:none}@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}.filters{display:block}.search{max-width:none;margin-bottom:12px}}@media(max-width:700px){.sidebar{position:static;width:auto;min-height:auto}.main{margin-left:0}.topbar{padding:0 18px}.content{padding:22px 17px}.stats{grid-template-columns:1fr 1fr}.intro{display:block}.intro .primary{width:100%;margin-top:15px}.docs,.grid{grid-template-columns:1fr}.filter-list{display:grid;grid-template-columns:1fr 1fr}.footer,.modal-foot{display:block}.modal-foot .primary,.modal-foot .secondary{margin-top:10px;width:100%}}
  </style>
</head>
<body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const GAS=window.google&&google.script&&google.script.run;let data=[],banks=[],filter={q:'',month:'0',year:'all',bank:'all',status:'all'},editing=null;
const $=id=>document.getElementById(id),rupiah=value=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(value)||0),status=docs=>{const n=docs.filter(Boolean).length;return n===3?'BUKTI LENGKAP':n?'SEBAGIAN LENGKAP':'TIDAK ADA BUKTI'},toast=message=>{$('toast').textContent=message;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)};
function call(name,args=[]){return new Promise((resolve,reject)=>{if(!GAS){reject(new Error('google.script.run tidak tersedia.'));return}GAS.withSuccessHandler(resolve).withFailureHandler(error=>reject(error))[name](...args)})}
function render(){const filtered=data.filter(t=>{const d=new Date(t.tanggalTransaksi);return(!filter.q||t.noTransaksi.toLowerCase().includes(filter.q)||t.namaBank.toLowerCase().includes(filter.q))&&(filter.month==='0'||String(d.getMonth()+1)===filter.month)&&(filter.year==='all'||t.tanggalTransaksi.startsWith(filter.year))&&(filter.bank==='all'||t.namaBank===filter.bank)&&(filter.status==='all'||t.statusBukti===filter.status)}).sort((a,b)=>b.tanggalTransaksi.localeCompare(a.tanggalTransaksi));const total=filtered.reduce((s,t)=>s+Number(t.jumlahTransaksi),0);$('app').innerHTML=`<aside class="sidebar"><div class="brand"><div class="brand-icon">✓</div><div><strong>VERIFIKASI</strong><small>FILLING</small></div></div><div class="side-label">WORKSPACE</div><div class="nav"><button class="active">▦ &nbsp; Dashboard</button><button onclick="location.hash='transaksi'">▤ &nbsp; Transaksi</button></div><div class="side-bottom"><div class="secure">▣ &nbsp; <b>Google Workspace</b><br>Data terhubung ke Sheet & Drive</div><div class="user">◉ <span><b>Finance & Accounting</b><br>Workspace aktif</span></div></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">FINANCE CONTROL DESK</div><h1>Dashboard</h1></div><div class="today">▣ &nbsp; ${new Intl.DateTimeFormat('id-ID',{dateStyle:'full'}).format(new Date())}</div></header><div class="content"><div class="intro"><div><div class="eyebrow">RINGKASAN VERIFIKASI</div><h2>Kontrol kelengkapan dokumen</h2><p>Pantau bukti transaksi dan tindak lanjuti dokumen yang belum lengkap.</p></div><button class="primary" onclick="openForm()">＋ Tambah Transaksi</button></div><section class="stats">${stat('Total Transaksi',filtered.length,'Semua transaksi','blue')}${stat('Bukti Lengkap',filtered.filter(t=>t.statusBukti==='BUKTI LENGKAP').length,'sudah terverifikasi','green')}${stat('Sebagian Lengkap',filtered.filter(t=>t.statusBukti==='SEBAGIAN LENGKAP').length,'perlu tindak lanjut','amber')}${stat('Tidak Ada Bukti',filtered.filter(t=>t.statusBukti==='TIDAK ADA BUKTI').length,'segera lengkapi','red')}${stat('Total Nilai Transaksi',rupiah(total),'mengikuti filter aktif','navy')}</section><section class="panel filters"><div class="search">⌕ <input placeholder="Cari No Transaksi atau Nama Bank..." value="${filter.q}" oninput="filter.q=this.value.toLowerCase();render()"></div><div class="filter-list">${select('month','Bulan',['Semua Bulan','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'])}${select('year','Tahun',['Semua Tahun',...years(filtered)])}${select('bank','Bank',['Semua Bank',...banks])}${select('status','Status',['Semua Status','Bukti Lengkap','Sebagian Lengkap','Tidak Ada Bukti'])}</div></section><section class="table-wrap"><div class="table-head"><div><div class="kicker">DATA TRANSAKSI</div><h3>Daftar transaksi</h3></div><span>${filtered.length} transaksi ditemukan</span></div><div class="table-scroll"><table><thead><tr><th>No</th><th>Transaksi</th><th>Bank</th><th>Tanggal</th><th>Jumlah</th><th>Pengajuan</th><th>Bayar</th><th>Invoice</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${filtered.map((t,i)=>row(t,i+1)).join('')}</tbody></table></div>${filtered.length?'':'<div class="empty-state">Belum ada transaksi yang cocok.<br>Ubah filter atau tambahkan transaksi baru.</div>'}<div class="footer"><span>Menampilkan semua data terfilter</span><span>Google Sheets sebagai database</span></div></section><div class="notice">ⓘ Mode Google Apps Script aktif — upload file akan disimpan ke Google Drive sesuai struktur tahun, bulan, transaksi, dan jenis dokumen.</div></div></main>`}
function stat(label,value,note,tone){return `<article class="stat"><span>${label}</span><strong>${value}</strong><small>${note}</small></article>`}function years(rows){return [...new Set(rows.map(t=>t.tanggalTransaksi.slice(0,4)))]}function select(key,label,items){return `<label>${label}<select onchange="filter.${key}=this.value;render()">${items.map((x,i)=>{const value=key==='month'?i:key==='status'?(i?'SEBAGIAN LENGKAP':'all'):key==='year'?(i?x:'all'):key==='bank'?(i?x:'all'):'all';return`<option value="${value}" ${filter[key]===value?'selected':''}>${x}</option>`}).join('')}</select></label>`}function row(t,i){return `<tr><td>${String(i).padStart(2,'0')}</td><td><b>${t.noTransaksi}</b><br><small>Transaksi keuangan</small></td><td>${t.namaBank}</td><td>${new Date(t.tanggalTransaksi).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}</td><td class="amount">${rupiah(t.jumlahTransaksi)}</td>${docCell(t.buktiPengajuan)}${docCell(t.buktiBayar)}${docCell(t.invoice)}<td><span class="badge ${t.statusBukti==='BUKTI LENGKAP'?'complete':t.statusBukti==='SEBAGIAN LENGKAP'?'partial':'empty'}">${t.statusBukti}</span></td><td><div class="actions"><button class="edit" onclick="openForm('${t.id}')">✎</button><button class="delete" onclick="confirmDelete('${t.id}')">⌫</button></div></td></tr>`}function docCell(doc){return`<td>${doc?`<a class="doc" href="${doc.fileUrl||doc.url}" target="_blank">↗ Lihat</a>`:'<span class="missing">Belum ada</span>'}</td>`}
function openForm(id){editing=data.find(t=>t.id===id)||null;const t=editing||{noTransaksi:'',namaBank:'',tanggalTransaksi:'',jumlahTransaksi:'',buktiPengajuan:null,buktiBayar:null,invoice:null};$('app').insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><div class="modal"><header><div><div class="eyebrow">${editing?'PERBARUI DATA':'DATA TRANSAKSI BARU'}</div><h2>${editing?'Edit transaksi':'Tambah transaksi'}</h2></div><button class="close" onclick="closeModal()">×</button></header><form class="form" onsubmit="save(event)"><div class="grid"><label>No Transaksi <em>*</em><input id="f-no" required value="${t.noTransaksi}"></label><label>Nama Bank <em>*</em><select id="f-bank" required><option value="">Pilih bank</option>${banks.map(b=>`<option ${b===t.namaBank?'selected':''}>${b}</option>`).join('')}</select></label><label>Tanggal Transaksi <em>*</em><input id="f-date" type="date" required value="${t.tanggalTransaksi}"></label><label>Jumlah Transaksi <em>*</em><input id="f-amount" type="number" min="1" required value="${t.jumlahTransaksi}"></label></div><div class="docs">${docForm('buktiPengajuan','Bukti Pengajuan',t.buktiPengajuan)}${docForm('buktiBayar','Bukti Bayar',t.buktiBayar)}${docForm('invoice','Invoice',t.invoice)}</div><div class="modal-foot"><span>Status dihitung otomatis</span><div><button type="button" class="secondary" onclick="closeModal()">Batal</button> <button class="primary">Simpan Transaksi</button></div></div></form></div></div>`)}function docForm(key,label,doc){return`<div class="doc-box"><h4>${label}</h4><input id="${key}-file" type="file"><input id="${key}-link" type="text" placeholder="Link Google Drive" value="${doc&&doc.fileUrl||doc&&doc.url||''}"></div>`}function closeModal(){$('modal')&&$('modal').remove();editing=null}function save(event){event.preventDefault();const payload={noTransaksi:$('f-no').value,namaBank:$('f-bank').value,tanggalTransaksi:$('f-date').value,jumlahTransaksi:Number($('f-amount').value)};['buktiPengajuan','buktiBayar','invoice'].forEach(key=>{const link=$(key+'-link').value.trim();payload[key]=link?{url:link,name:'Link Google Drive'}:null});const fn=editing?'updateTransaction':'addTransaction';call(fn,editing?[editing.id,payload]:[payload]).then(result=>{if(editing)data=data.map(t=>t.id===result.id?result:t);else data.unshift(result);closeModal();render();toast('Transaksi berhasil disimpan.')}).catch(error=>toast(error.message||String(error)))}function confirmDelete(id){const t=data.find(x=>x.id===id);if(!confirm('Apakah Anda yakin ingin menghapus transaksi ini? File Google Drive tidak akan dihapus.'))return;call('deleteTransaction',[id]).then(()=>{data=data.filter(x=>x.id!==id);render();toast('Transaksi dihapus dari Google Sheets.')}).catch(error=>toast(error.message||String(error)))}
function load(){Promise.all([call('getData'),call('getBanks')]).then(values=>{data=values[0]||[];banks=values[1]||[];render()}).catch(error=>{document.body.innerHTML='<div style="padding:40px;font-family:Arial"><h2>Konfigurasi belum lengkap</h2><p>'+error.message+'</p><p>Ganti SPREADSHEET_ID dan DRIVE_FOLDER_ID pada Code.gs, lalu jalankan authorization.</p></div>'})}load();
</script></body></html>
